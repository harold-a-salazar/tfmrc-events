<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFMRC Events &amp; Reminders</title>
<meta name="description" content="Trainings, seminars, surveys and bulletins of the Treasury and Financial Management Reporting and Compliance Department — calendar, reminders and monitoring.">
<meta name="theme-color" content="#5c4ab6">

<!-- Link preview (Viber, Messenger, Teams, etc.) -->
<meta property="og:title" content="TFMRC Events & Reminders">
<meta property="og:description" content="Trainings, seminars, surveys and bulletins — calendar, reminders and monitoring.">
<meta property="og:type" content="website">

<!-- Tab icon: Hann mark on purple -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235c4ab6'/%3E%3Cg fill='%23fff'%3E%3Crect x='17' y='18' width='6' height='26'/%3E%3Crect x='29' y='13' width='6' height='11'/%3E%3Crect x='29' y='29' width='6' height='24'/%3E%3Crect x='41' y='18' width='6' height='26'/%3E%3C/g%3E%3C/svg%3E">

<style>
  html,body{margin:0;height:100%;background:#f6f4fc;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}

  /* splash while the portal loads */
  #splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
          background:#5c4ab6;color:#fff;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;transition:opacity .4s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash svg{width:150px;height:auto}
  #splash h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
  #splash p{margin:0;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#c8e772}
  .bar{width:180px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#c8e772;border-radius:4px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #help{display:none;font-size:13px;color:#fff;opacity:.9}
  #help a{color:#c8e772;font-weight:700}
</style>
</head>
<body>

<div id="splash">
  <svg viewBox="4 6 124 68" aria-label="Hann Resorts">
    <g fill="#fff"><rect x="8" y="18" width="6" height="37"/><rect x="21" y="11" width="6" height="16"/>
      <rect x="21" y="35" width="6" height="35"/><rect x="34" y="18" width="6" height="37"/></g>
    <text x="56" y="40" fill="#fff" font-family="Roboto,Arial,sans-serif" font-weight="500" font-size="21" letter-spacing="3.5">HANN</text>
    <text x="56" y="61" fill="#fff" fill-opacity=".85" font-family="Roboto,Arial,sans-serif" font-weight="300" font-size="14" letter-spacing="1">RESORTS</text>
  </svg>
  <h1>TFMRC Events &amp; Reminders</h1>
  <p>Loading portal…</p>
  <div class="bar"><i></i></div>
  <div id="help">Taking too long? <a id="direct" target="_top">Open the portal directly</a></div>
</div>

<iframe id="app" title="TFMRC Events & Reminders" allow="clipboard-write; fullscreen"></iframe>

<script>
  // Your Google Apps Script web app link
  const PORTAL_URL = 'https://script.google.com/macros/s/AKfycbyQYHQuiRqC35NvYyCwWHZgrckJUBDCP_0dj8S0j6tUHRB4r5VvpcYwaOp3GiAxpUKX/exec';

  const app = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('direct').href = PORTAL_URL;
  app.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 300));
  app.src = PORTAL_URL;
  // If it is still loading after 10 seconds, offer a direct link
  setTimeout(() => { if (!splash.classList.contains('hide')) document.getElementById('help').style.display = 'block'; }, 10000);
</script>
</body>
</html>
